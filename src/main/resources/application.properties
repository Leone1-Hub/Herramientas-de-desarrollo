spring.application.name=Tienda

# ---- Base de datos MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Mitienda?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# ---- Servidor ----
server.port=8080

# ---- Seguridad JWT ----
jwt.secret=${JWT_SECRET:clave-secreta-para-desarrollo-de-al-menos-32-caracteres-segura}
spring.mvc.problemdetails.enabled=true

