<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Tienda de Abarrotes</title>
    <link rel="stylesheet" href="elogin.css">
</head>
<body class="cuerpo-pagina">
    <main class="contenedor-formulario">
        <h2 class="titulo-formulario">Iniciar Sesión</h2>

        <form id="formulario-login" class="formulario">
            <div class="grupo-campo">
                <label for="campo-usuario-login" class="etiqueta-campo">Usuario</label>
                <input type="text" id="campo-usuario-login" class="entrada-texto" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="grupo-campo">
                <label for="campo-clave-login" class="etiqueta-campo">Contraseña</label>
                <input type="password" id="campo-clave-login" class="entrada-texto" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" id="boton-ingresar" class="boton-accion">Ingresar</button>
        </form>

        <div id="mensaje-estado-login" class="mensaje-alerta"></div>

        <footer class="pie-formulario">
            <span>¿No tienes una cuenta aún?</span>
            <a href="registro.html" class="enlace-redireccion">Crear cuenta</a>
        </footer>
    </main>

    <script src="login.js"></script>
</body>
</html>
