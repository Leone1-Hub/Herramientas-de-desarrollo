name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Boton "Run workflow" en la pestana Actions de GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "tags=$IMAGE:latest,$IMAGE:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

  # Despliega en la PC con el runner self-hosted (Windows + Docker Desktop):
  # descarga la imagen recien publicada y reemplaza el contenedor "tienda".
  deploy:
    runs-on: self-hosted
    needs: package
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency: deploy-tienda
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/leone1-hub/herramientas-de-desarrollo
    defaults:
      run:
        shell: cmd
    steps:
      - name: Descargar la imagen nueva
        run: |
          echo ${{ secrets.GITHUB_TOKEN }}| docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull %IMAGE%:%GITHUB_SHA:~0,7% || exit /b 1

      - name: Reemplazar el contenedor
        run: |
          docker rm -f tienda 2>nul
          docker run -d --name tienda --restart unless-stopped -p 8080:8080 -e SPRING_PROFILES_ACTIVE=h2 %IMAGE%:%GITHUB_SHA:~0,7% || exit /b 1

      - name: Verificar que la API responde
        run: |
          for /L %%i in (1,1,40) do (
            curl -s -o nul -w "%%{http_code}" http://localhost:8080/api/productos | findstr /x 200 >nul && (echo API arriba en http://localhost:8080 & exit /b 0)
            ping -n 4 127.0.0.1 >nul
          )
          docker logs --tail 50 tienda
          exit /b 1
